<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>State Board Books, Syllabus &amp; Papers — PPT Store</title>
<meta name="description" content="State board ki Syllabus, Book &amp; Answers, Previous Year Questions, Practice Questions aur Model Paper — Class 1 se 12, Hindi / English, PDF, Word aur PPT me." />
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="96x96" href="/uploads/brand/icon-96.png">
<script>
(function(){var m="system";var w=/(?:^|;)la_theme=(\w+)/.exec(window.name);if(w)m=w[1];else try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.classList.toggle("light",l);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--card:#0f121b;--card2:#151927;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f4f5fb;--muted:#9aa1b8;--c:#f97316}
html.light{--bg:#f6f5fb;--card:#fff;--card2:#f4f3fa;--line:rgba(20,16,40,.08);--line2:rgba(20,16,40,.14);--text:#16131f;--muted:#5d5873}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
 background-image:radial-gradient(600px 300px at 10% -10%,rgba(249,115,22,.14),transparent),radial-gradient(500px 300px at 100% 0,rgba(139,44,255,.12),transparent)}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700}
.brand img{height:22px;width:auto}
.back{font-size:.82rem;color:var(--muted);padding:6px 12px;border:1px solid var(--line2);border-radius:99px}
.back:hover{color:var(--text);border-color:var(--c)}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;line-height:1.2;margin:6px 0 2px}
.sub{color:var(--muted);font-size:.85rem}
/* Filter: chhota, ek jagah */
.flt{position:sticky;top:0;z-index:5;margin:14px 0 16px;padding:10px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:10px;font-weight:700;font-size:.82rem;color:var(--muted);border:1px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text);border-color:var(--line2)}
.tab[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 6px 14px -8px var(--c)}
.row2{display:flex;gap:8px;align-items:center}
.sel{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);font-size:.82rem;font-weight:700}
.sel span{color:var(--muted);font-weight:600}
.sel select{height:34px;padding:0 6px;font-weight:800;outline:0;background:transparent}
.sel select option{background:var(--card);color:var(--text)}
.seg{display:flex;padding:3px;border:1px solid var(--line2);border-radius:10px;background:var(--card2)}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:.8rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cnt{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
/* Subject list */
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;transition:.18s}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#f97316,#8b2cff)}
.it:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 14px 30px -20px rgba(0,0,0,.5)}
.no{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:.85rem;color:var(--muted)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:.98rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:.76rem}
.fs{display:flex;gap:8px;flex:none}
.f{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;transition:transform .15s}
.f:hover{transform:translateY(-3px)}
.f svg{width:34px;height:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.f em{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.f:hover em{color:var(--text)}
@media (max-width:560px){
 h1{font-size:1.25rem}
 .it{gap:10px;padding:10px 10px 10px 14px}
 .no{width:26px;height:26px;font-size:.75rem}
 .nm b{font-size:.88rem;white-space:normal}.nm small{display:none}
 .fs{gap:4px}.f{width:36px}.f svg{width:28px;height:33px}.f em{font-size:.55rem}
 .cnt{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="doc" viewBox="0 0 34 40"><path d="M4 0h18l12 12v24a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="currentColor"/><path d="M22 0v8a4 4 0 0 0 4 4h8z" fill="#fff" opacity=".45"/></symbol>
</svg>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html"><img src="uploads/brand/logo.webp" alt="PPT Store logo" width="50" height="22">PPT Store</a>
    <a class="back" href="index.html">← Home</a>
  </div>
  <h1 id="ttl">State Board</h1>
  <p class="sub" id="sub"></p>

  <div class="flt">
    <div class="tabs" id="tabs"></div>
    <div class="row2">
      <label class="sel"><span>Class</span><select id="cls" aria-label="Class"></select></label>
      <div class="seg" id="med"><button type="button" data-v="Hindi">Hindi</button><button type="button" data-v="English">English</button></div>
      <span class="cnt" id="cnt"></span>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>
<script>
(function(){
const STATES=["Bihar","UP","Andhra Pradesh","Chhattisgarh","West Bengal","Gujarat","Karnataka","Kerala","Madhya Pradesh","Haryana","Maharashtra","Punjab","Rajasthan","Tamilnadu","Jharkhand","Telangana","CISCE","NIOS","Odisha","Assam","Jammu & Kashmir"];
const TYPES=["Syllabus","Book & Answers","Previous Year Questions","Practice Questions","Model Paper"];
const YEAR="2026-27";
const SUBJ=c=>c<=5?["English","Hindi","Maths","EVS","Computer","General Knowledge"]
 :c<=8?["English","Hindi","Sanskrit","Maths","Science","Social Science","Computer"]
 :c<=10?["English","Hindi","Sanskrit","Maths","Science","Social Science"]
 :["English","Hindi","Physics","Chemistry","Maths","Biology","Accountancy","Business Studies","Economics","History","Political Science","Geography","Computer Science"];
const FMT=[["PDF","#e5484d","PDF"],["Word","#2b6cde","W"],["PPT","#e8590c","P"]];
const qs=new URLSearchParams(location.search);
const st=STATES.includes(qs.get("s"))?qs.get("s"):"Bihar";
const s={t:TYPES.includes(qs.get("t"))?qs.get("t"):TYPES[0],c:+qs.get("c")>=1&&+qs.get("c")<=12?+qs.get("c"):10,m:qs.get("m")==="English"?"English":"Hindi"};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const $=id=>document.getElementById(id);
$("ttl").textContent=st+" Board";
$("tabs").innerHTML=TYPES.map(t=>`<button type="button" class="tab" data-v="${esc(t)}">${esc(t)}</button>`).join("");
$("cls").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}th</option>`).join("").replace(">1th<",">1st<").replace(">2th<",">2nd<").replace(">3th<",">3rd<");
const icon=([k,col,l])=>`<svg viewBox="0 0 34 40" style="color:${col}"><use href="#doc"/><text x="15" y="30" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans,Arial" font-weight="800" font-size="${l.length>1?9:15}">${l}</text></svg>`;
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===s.t));
 document.querySelectorAll("#med button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===s.m));
 $("cls").value=s.c;
 const subs=SUBJ(s.c);
 $("sub").textContent=`${s.t} · Class ${s.c} · ${s.m} Medium`;
 $("cnt").textContent=subs.length+" subjects";
 $("list").innerHTML=subs.map((x,i)=>`<div class="it"><span class="no">${i+1}</span><div class="nm"><b>${esc(x)} - ${YEAR}</b><small>${esc(s.t)} · Class ${s.c} · ${s.m}</small></div><div class="fs">${FMT.map(f=>`<a class="f" href="ready-ppts.html?q=${encodeURIComponent(`${st} ${s.t} Class ${s.c} ${x} ${s.m} ${f[0]}`)}" title="${esc(x)} — ${f[0]}">${icon(f)}<em>${f[0]==="PPT"?"PPT":f[0].toUpperCase()}</em></a>`).join("")}</div></div>`).join("");
 document.title=`${st} Board ${s.t} Class ${s.c} — PPT Store`;
 history.replaceState(null,"","?"+new URLSearchParams({s:st,t:s.t,c:s.c,m:s.m}));
}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){s.t=b.dataset.v;render();}};
$("med").onclick=e=>{const b=e.target.closest("button");if(b){s.m=b.dataset.v;render();}};
$("cls").onchange=e=>{s.c=+e.target.value;render();};
render();
})();
</script>
</body>
</html>
