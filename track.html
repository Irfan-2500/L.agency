<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Order — PPT Store</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="48x48" href="/uploads/brand/icon-48.png"><link rel="icon" type="image/png" sizes="96x96" href="/uploads/brand/icon-96.png"><link rel="icon" type="image/png" sizes="192x192" href="/uploads/brand/icon-192.png"><link rel="apple-touch-icon" href="uploads/brand/apple-touch-icon.png">
<script>
/* Theme: homepage wali setting yahan bhi lagti hai */
(function(){var m="system";var w=/(?:^|;)la_theme=(\w+)/.exec(window.name);if(w)m=w[1];else try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
var r=document.documentElement;r.classList.toggle("light",l);r.setAttribute("data-mode",m);})();
</script>
<meta name="description" content="Apne custom PPT order ka status dekhein: order number aur mobile number daalein." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== COLORS (homepage jaise) ===== */
:root{
  --bg:#07080c; --bg2:#0b0d14; --card:#0f121b; --card2:#141826;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f4f5fb; --muted:#9aa1b8; --dim:#6b7290;
  --violet:#8b2cff; --cyan:#06b6d4; --pink:#ec4899; --green:#22c55e; --amber:#f59e0b; --gold:#fde047;
  --grad:linear-gradient(90deg,#8b2cff,#06b6d4);
  --shadow:0 20px 60px -20px rgba(139,44,255,.45);
}
html.light{
  --bg:#f6f5fb; --bg2:#eeedf6; --card:#ffffff; --card2:#f3f2fa;
  --line:rgba(20,16,40,.09); --line2:rgba(20,16,40,.16);
  --text:#16131f; --muted:#5d5873; --dim:#8a85a0; --shadow:0 18px 40px -22px rgba(139,44,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk','Hind',sans-serif;line-height:1.2;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.container{width:min(1240px,100% - 32px);margin-inline:auto}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#fde047,#f59e0b);color:#1a1200}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--card2);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-wa{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#22c55e}
.btn-sm{padding:9px 12px;font-size:.82rem;border-radius:10px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box}
.logo b{font-family:'Space Grotesk';font-size:1rem;display:block;line-height:1}
.logo small{font-size:.58rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.back{margin-left:auto;color:var(--muted);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px}
.back:hover{color:var(--text);background:var(--card2)}

/* ===== MY PPTs ===== */
main{padding:40px 0 70px}
.box{width:min(440px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.box h1{font-size:1.5rem} .box p{color:var(--muted);font-size:.9rem}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(139,44,255,.15);color:#c084fc}
.ic svg{width:26px;height:26px}
label{display:grid;gap:6px;font-size:.84rem;font-weight:700}
input{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;font-size:1rem;width:100%}
input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,44,255,.2)}
.otp{letter-spacing:.5em;text-align:center;font-size:1.3rem;font-weight:800}
input::placeholder{color:var(--dim);opacity:.7;font-weight:500}
input:focus-visible{outline:none}
.en{display:block;font-size:.8rem;color:var(--dim);margin-top:3px}
.btn{width:100%}
.links{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.links button{color:var(--cyan);font-weight:700} .links button:disabled{color:var(--dim);cursor:default}
.box .msg{font-size:.84rem;font-weight:600;color:#ef4444;min-height:1.2em}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:1.6rem} .top p{color:var(--muted);font-size:.9rem}
.top .btn{width:auto;margin-left:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.thumb{aspect-ratio:16/9;background:var(--card2) center/cover}
.item .b{padding:14px;display:grid;gap:10px}
.item b{font-family:'Space Grotesk','Hind';font-size:1rem;line-height:1.3}
.item small{color:var(--muted);font-size:.78rem;font-weight:600}
.congrats{display:flex;gap:14px;align-items:center;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.congrats>span{font-size:2rem} .congrats b{font-size:1.05rem} .congrats p{color:var(--muted);font-size:.88rem;margin-top:2px}
.item.new{border-color:var(--gold);box-shadow:0 0 0 2px rgba(253,224,71,.35)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;display:grid;gap:14px;justify-items:center}
.empty .btn{width:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Dark / Light / System switch (homepage jaisa) */
.theme-sw{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line2);flex:none}
.theme-sw button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:9px;color:var(--muted);transition:.2s;background:none;border:0;cursor:pointer}
.theme-sw button svg{width:16px;height:16px}
.theme-sw button:hover{color:var(--text);background:var(--card2)}
.theme-sw button[aria-checked="true"]{color:#fff;background:linear-gradient(135deg,#8b2cff,#06b6d4);box-shadow:0 0 12px rgba(139,44,255,.45)}
@media(max-width:420px){.theme-sw button{width:28px}}
@media(max-width:560px){.nav{gap:8px}.logo b{white-space:nowrap;font-size:.92rem}.logo small{display:none}.back{padding:8px 4px;font-size:.8rem;white-space:nowrap}}
@media(max-width:420px){.back{font-size:0;padding:8px}.theme-sw button{width:27px}}
/* Theme: band rahe to sirf chuni hui theme dikhe, click par teeno khulein */
.theme-sw:not(.open) button:not([aria-checked="true"]){display:none}
/* ===== TRACK ORDER ===== */
.steps{display:grid;gap:0;margin-top:4px}
.st{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:18px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:16px;top:32px;bottom:2px;width:2px;background:var(--line2)}
.st:last-child::before{display:none}
.st .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1.5px solid var(--line2);color:var(--dim);font-weight:800;font-size:.85rem;z-index:1}
.st.done .dot{background:rgba(34,197,94,.15);border-color:#22c55e;color:#22c55e}
.st.now .dot{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 14px rgba(139,44,255,.5)}
.st.done::before{background:#22c55e}
.st b{display:block;font-size:.95rem} .st small{color:var(--muted);font-size:.8rem}
.st:not(.done):not(.now) b{color:var(--dim)}
.kv{display:grid;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem}
.kv span{color:var(--muted)}
.cancel{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:#f87171;border-radius:12px;padding:12px 14px;font-weight:700}
/* ===== PPT READY: demo + payment + download ===== */
#res.wide{width:min(760px,100%)}
.rd{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.rd-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rd-h h2{font-size:1.15rem}
.rd-h .pill{margin-left:auto;font-weight:800;font-size:.8rem;padding:5px 10px;border-radius:99px;background:rgba(253,224,71,.14);border:1px solid rgba(253,224,71,.45);color:var(--gold)}
html.light .rd-h .pill{color:#a16207}
.demo{display:grid;gap:8px}
.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card2);border:1px solid var(--line2)}
.stage img{width:100%;height:100%;object-fit:contain;background:#fff}
.stage .nav-b{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(7,8,12,.6);color:#fff;border:1px solid rgba(255,255,255,.25)}
.stage .nav-b:disabled{opacity:.3}
.stage .nav-b.l{left:8px} .stage .nav-b.r{right:8px}
.stage .cnt{position:absolute;right:8px;bottom:8px;background:rgba(7,8,12,.65);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.thumbs button{flex:none;width:76px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#fff;opacity:.65;padding:0}
.thumbs button.on{border-color:var(--violet);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.stage.lk img{filter:blur(1.5px);transform:scale(1.02)} .stage.lk.lr img{filter:none;transform:none}
.lk-cta{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:14px;background:rgba(7,8,12,.02);color:#fff}
.lk-cta .lk-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.7);font-size:1.3rem}
.lk-cta b{font-size:1rem;background:rgba(7,8,12,.7);padding:4px 12px;border-radius:10px} .lk-cta small{font-size:.8rem;background:rgba(7,8,12,.7);padding:3px 10px;border-radius:8px}
.lk-cta .lk-ic{background:rgba(7,8,12,.6)}
.lk-cta .btn{width:auto;margin-top:4px;padding:9px 14px;font-size:.84rem}
.stage.lk .cnt{top:8px;bottom:auto}
@media(max-width:520px){.lk-cta{gap:4px;padding:8px}.lk-cta small{display:none}.lk-cta .lk-ic{width:36px;height:36px;font-size:1rem}.lk-cta b{font-size:.9rem}.lk-cta .btn{padding:7px 12px;font-size:.78rem}}
.thumbs button{position:relative}
.thumbs button span{position:absolute;right:3px;bottom:3px;background:rgba(7,8,12,.7);color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:5px}
.thumbs button.lk img{filter:blur(.5px)} .thumbs button.lr img{filter:none}
.thumbs button.lk span{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);font-size:.8rem;background:rgba(7,8,12,.75)}
.lock-n{font-size:.8rem;color:var(--muted);text-align:center}
.paybox{display:grid;gap:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:16px}
.paybox h3{font-size:1.02rem;text-align:center}
.paybox h3 b{color:var(--gold)} html.light .paybox h3 b{color:#a16207}
.qr-wrap{display:grid;justify-items:center;gap:6px}
.qr{width:200px;max-width:100%;aspect-ratio:1;background:#fff;border-radius:12px;padding:6px;display:grid;place-items:center;overflow:hidden}
.qr img,.qr svg{width:100%;height:100%;object-fit:contain;display:block}
.qr .wait{color:#555;font-size:.8rem;font-weight:600;text-align:center;padding:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.75rem;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.apps button{display:grid;gap:4px;justify-items:center;padding:8px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line2);font-size:.7rem;font-weight:700;line-height:1.2;transition:.15s}
.apps button:hover{border-color:var(--gold);transform:translateY(-1px)}
.apps button:disabled{opacity:.5;transform:none}
.apps i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:800;overflow:hidden}
.apps i img{width:28px;height:28px}
.pay-note{font-size:.78rem;color:var(--muted);text-align:center}
@media(pointer:coarse){.paybox .qr-wrap{order:3}.paybox .or{order:2}}
.okbox{display:grid;gap:10px;justify-items:center;text-align:center;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.45);border-radius:16px;padding:20px 16px}
.okbox .tick{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(34,197,94,.18);color:#22c55e}
.okbox .tick svg{width:32px;height:32px}
.okbox h2{font-size:1.25rem} .okbox p{color:var(--muted);font-size:.86rem}
.okbox .btn{max-width:360px}
.live-n{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8rem}
.live-n button{color:var(--cyan);font-weight:700;font-size:.8rem}
#bell{white-space:normal;text-align:center;line-height:1.35}
#res>*{min-width:0}
#bell:disabled{opacity:.8;cursor:default;border-color:rgba(34,197,94,.45);color:#22c55e}
/* Theme sirf Home page par chuni jaati hai; baaki pages wahi theme follow karte hain */
.theme-sw{display:none!important}
</style>
<script src="js/protect.js"></script>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LA = window.LA_CONFIG || {}, SCRIPT = String(LA.orderUrl || "").trim(), WA = String(LA.whatsapp || "919711069435");
const STEPS = [["New", "Order mil gaya", "Hum aapka order dekh rahe hain"], ["In Progress", "PPT ban rahi hai", "Designer aapki PPT par kaam kar raha hai"], ["Done", "PPT ready hai", "Ready hote hi yahin demo, payment aur download milega"], ["Paid", "Order complete", "Payment mil gaya. Dhanyavaad! 🙏"]];
const DEMO = { id:"12", time:new Date(Date.now() - 5 * 36e5).toISOString(), name:"Rahul", topic:"Physics Class 12 — Electric Charges", theme:"Blue Science", slides:"25", status:"Done",
  ppt:{ price:250, slides:25, type:"pptx", payments:true, demo:["dark-chalk-physics-1","dark-chalk-physics-2","dark-chalk-physics-3","dark-chalk-physics-4","formula-board-maths-1","formula-board-maths-2","formula-board-maths-3","formula-board-maths-4","blue-red-gradient-1","blue-red-gradient-2"].map(n => `uploads/themes/samples/${n}.webp`) } };
const isDemo = () => !!(LA.previewDemo || window.claude || !SCRIPT);
async function api(action, body){
  try { const r = await fetch(SCRIPT, { method:"POST", body:JSON.stringify({ action, ...body }), headers:{ "Content-Type":"text/plain;charset=utf-8" } });
    return await r.json(); }
  catch(e) { return { ok:false, net:true, error:"इंटरनेट चेक करके दोबारा try करें। / Check internet and retry." }; }
}
async function track(id, phone){
  if (isDemo()) return id === "12" ? JSON.parse(JSON.stringify({ ok:true, ...DEMO })) : { ok:false, error:"Demo: order number 12 aur koi bhi mobile daalein." };
  let j = await api("customTrack", { id, phone });
  if (!j.ok && /Unknown action/i.test(j.error || "")) j = await api("track", { id, phone });   /* Google Script purana ho to bhi status dikhe */
  return j.ok ? j : { ok:false, error:/Unknown action/i.test(j.error || "") ? "Order tracking jald shuru hoga. Abhi WhatsApp par poochhein." : j.error };
}
/* Drive link → seedha download (mobile par Drive app / account chooser nahi khulta) */
const dlUrl = u => { const m = /drive\.google\.com\/.*(?:[?&]id=|\/d\/)([\w-]{20,})/.exec(u || ""); return m ? `https://drive.usercontent.google.com/download?id=${m[1]}&export=download&confirm=t` : u; };
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits:2 });
const icon = id => `<svg class="i"><use href="#${id}"/></svg>`;
const APPS = [
  { id:"phonepe", name:"PhonePe", ic:`<i><img src="uploads/brand/apps/phonepe.webp" alt="" width="28" height="28"></i>`, rzp:"phonepe" },
  { id:"gpay", name:"Google Pay", ic:`<i><img src="uploads/brand/apps/gpay.webp" alt="" width="28" height="28"></i>`, rzp:"google_pay" },
  { id:"paytm", name:"Paytm", ic:`<i><img src="uploads/brand/apps/paytm.webp" alt="" width="28" height="28"></i>`, rzp:"paytm" },
  { id:"other", name:"UPI / Card", ic:`<i style="background:linear-gradient(135deg,#8b2cff,#06b6d4)">₹</i>`, rzp:"" }
];
let CUR = null, WHO = null, QR = { id:"", timer:0, until:0 };
const stopQr = () => { clearTimeout(QR.timer); QR.id = ""; };

function show(o){
  CUR = o; stopQr();
  if (o.download) o.status = "Paid";
  const k = STEPS.findIndex(s => s[0] === o.status), when = new Date(o.time).toLocaleString("en-IN", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
  const wa = `https://wa.me/${WA}?text=${encodeURIComponent(`Hi PPT Store! Mera order #${o.id} ka status kya hai?`)}`;
  const steps = STEPS.map(s => s.slice());
  if (o.ppt) steps[2][2] = "Neeche demo dekhein, pay karein aur turant download karein 👇";
  if (o.download) steps[3][2] = "Payment mil gaya. PPT download karein 🙏";
  $("#res").classList.toggle("wide", !!o.ppt);
  $("#res").innerHTML = `<div><h1 style="font-size:1.3rem">Order #${esc(o.id)}</h1><p>Namaste ${esc(o.name)} · ${esc(when)}</p></div>
    <div class="kv"><div><span>PPT:</span> ${esc(o.topic)}</div>${o.theme && o.theme !== "—" ? `<div><span>Theme:</span> ${esc(o.theme)}</div>` : ""}${o.slides && o.slides !== "—" ? `<div><span>Slides:</span> ${esc(o.slides)}</div>` : ""}</div>
    ${o.download ? doneHtml(o) : ""}
    ${o.status === "Cancelled" ? `<div class="cancel">❌ Ye order cancel ho gaya hai. Koi sawaal ho to WhatsApp karein.</div>`
      : `<div class="steps">${steps.map((s, i) => `<div class="st ${i < k || (i === k && i === STEPS.length - 1) ? "done" : i === k ? "now" : ""}"><span class="dot">${i < k || (i === k && i === STEPS.length - 1) ? "✓" : i + 1}</span><div><b>${s[1]}</b><small>${s[2]}</small></div></div>`).join("")}</div>`}
    ${o.ppt ? readyHtml(o) : ""}
    ${!o.download && !o.ppt && o.status !== "Cancelled" && o.status !== "Paid" ? `<button type="button" class="btn btn-ghost" id="bell"></button>` : ""}
    <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener"><svg class="i"><use href="#i-msg"/></svg>WhatsApp par poochhein</a>
    ${isDemo() ? "" : `<p class="live-n"><span class="live">Live: status apne aap update hota hai</span><button type="button" id="other">Doosra order dekhein</button></p>`}`;
  $("#res").hidden = false; bellUi();
  if (o.ppt) { drawSlide(0); if (o.ppt.payments) makeQr(); }
  if (!show.done) $("#res").scrollIntoView({ behavior:"smooth", block:"start" });
}
function doneHtml(o){
  return `<div class="okbox" id="okbox"><span class="tick">${icon("i-check")}</span>
    <h2>🎉 Order complete!</h2><p>Payment mil gaya, dhanyavaad! Apni PPT abhi download kar lein.${o.paymentId ? `<br>Payment ID: <b>${esc(o.paymentId)}</b>` : ""}</p>
    <a class="btn btn-gold" id="dlBtn" href="${esc(dlUrl(o.download))}" target="_blank" rel="noopener">${icon("i-dl")} PPT download karein</a>
    <p style="font-size:.78rem">Download na ho to kabhi bhi isi page par order number + mobile daal kar dobara download kar sakte hain.</p></div>`;
}
function readyHtml(o){
  const p = o.ppt, d = p.demo || [];
  return `<div class="rd">
    <div class="rd-h"><h2>🎉 Aapki PPT ready hai!</h2><span class="pill">${p.slides ? `${esc(p.slides)} slides · ` : ""}${inr(p.price)}</span></div>
    ${d.length ? `<div class="demo">
      <div class="stage" id="stage"><img id="sImg" alt="PPT demo slide">
        <div class="lk-cta" id="lkCta" hidden><span class="lk-ic">🔒</span><b id="lkT"></b><small>${inr(p.price)} pay karke poori PPT paayein</small><button type="button" class="btn btn-gold" id="lkPay">Pay karke unlock karein</button></div>
        <button type="button" class="nav-b l" id="sPrev" aria-label="Pichhli slide">${icon("i-left")}</button><button type="button" class="nav-b r" id="sNext" aria-label="Agli slide">${icon("i-right")}</button>
        <span class="cnt" id="sCnt"></span></div>
      <div class="thumbs" id="thumbs">${slots(p).map((x, i) => `<button type="button" data-i="${i}" class="${x.lock ? "lk" : ""}${x.real ? " lr" : ""}" aria-label="${x.lock ? `Slide ${i + 1} locked` : `Slide ${i + 1}`}"><img src="${esc(x.src)}" alt="" loading="lazy"><span>${x.lock ? "🔒" : i + 1}</span></button>`).join("")}</div>
      <p class="lock-n">🔒 ${d.length} slides free demo${slots(p).length > d.length ? ` · baaki ${slots(p).length - d.length} slides lock hain (kul ${slots(p).length})` : ""}. Payment ke baad poori PPT turant download hogi.</p></div>` : ""}
    <div class="paybox" id="paybox">
      ${p.payments ? `<h3>Pay <b>${inr(p.price)}</b> aur PPT turant download karein</h3>
        <div class="qr-wrap" id="qrWrap"><div class="qr" id="qrImg"><div class="wait">QR ban raha hai…</div></div>
          <span class="live" id="qrLive" hidden>PhonePe / GPay / Paytm se scan karein · payment ka intezaar</span></div>
        <div class="or" id="qrOr">ya app se pay karein</div>
        <div class="apps" id="apps">${APPS.map(a => `<button type="button" data-app="${a.id}">${a.ic}<span>${a.name}</span></button>`).join("")}</div>
        <p class="pay-note" id="payNote">🔒 Razorpay se safe payment. Amount fixed hai, payment hote hi yahin download ka button aa jayega.</p>`
      : `<h3>Payment ke liye WhatsApp karein</h3><p class="pay-note">Online payment abhi band hai. WhatsApp par order #${esc(o.id)} bhejein, hum payment link bhej denge.</p>`}
    </div></div>`;
}
/* Demo slides viewer */
let SI = 0;
/* Pehli slides khuli, baaki sab dikhti hain par lock (dhundhli). Locked par asli photo kabhi nahi, sirf free wali dhundhli */
function slots(p){ const d = p.demo || [], N = Math.max(d.length, Math.min(Number(p.slides) || 0, 300));
  const L = p.locked || [];   // baaki slides ki asli (pehle se dhundhli) photo; na ho to free wali dobara
  return Array.from({ length:N }, (_, k) => k < d.length ? { src:d[k], lock:false } : L[k - d.length] ? { src:L[k - d.length], lock:true, real:true } : { src:d[k % d.length], lock:true }); }
function drawSlide(i){
  const p = CUR && CUR.ppt, d = (p && p.demo) || []; if (!d.length || !$("#sImg")) return;
  const S = slots(p); SI = Math.max(0, Math.min(S.length - 1, i)); const x = S[SI];
  $("#sImg").src = x.src; $("#sCnt").textContent = `Slide ${SI + 1} / ${S.length}`;
  $("#stage").classList.toggle("lk", x.lock); $("#stage").classList.toggle("lr", !!x.real); $("#lkCta").hidden = !x.lock; if (x.lock) $("#lkT").textContent = `Slide ${SI + 1} locked`;
  $("#sPrev").disabled = SI === 0; $("#sNext").disabled = SI === S.length - 1;
  document.querySelectorAll("#thumbs button").forEach((b, j) => b.classList.toggle("on", j === SI));
  const t = document.querySelector(`#thumbs button[data-i="${SI}"]`); if (t) t.scrollIntoView({ block:"nearest", inline:"nearest" });
}
document.addEventListener("click", e => {
  if (e.target.closest("#sPrev")) drawSlide(SI - 1);
  else if (e.target.closest("#sNext")) drawSlide(SI + 1);
  else if (e.target.closest("#lkPay")) { const b = $("#paybox"); if (b) b.scrollIntoView({ behavior:"smooth", block:"center" }); }
  else { const t = e.target.closest("#thumbs button"); if (t) drawSlide(+t.dataset.i); }
});
document.addEventListener("keydown", e => { if (!$("#sImg") || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") drawSlide(SI - 1); if (e.key === "ArrowRight") drawSlide(SI + 1); });
(() => { let x0 = null; document.addEventListener("touchstart", e => { x0 = e.target.closest("#stage") ? e.touches[0].clientX : null; }, { passive:true });
  document.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) drawSlide(SI + (dx < 0 ? 1 : -1)); x0 = null; }); })();

/* Razorpay QR: amount fixed, scan karke pay karte hi yahin download */
async function makeQr(){
  if (isDemo()) { $("#qrImg").innerHTML = `<img src="uploads/payment/upi-qr.png" alt="Demo QR" onerror="this.remove()">`; $("#qrLive").hidden = false; return; }
  const r = await api("customPayQr", WHO);
  if (!CUR || !$("#qrImg")) return;
  if (r.ok && r.paid) return paidNow(r);
  if (!r.ok || !(r.image || r.link)) { $("#qrWrap").hidden = true; $("#qrOr").hidden = true; return; }   /* QR na bane to sirf app buttons */
  QR.id = r.qrId; QR.until = Date.now() + 25 * 6e4;
  if (r.image) $("#qrImg").innerHTML = `<img src="${esc(r.image)}" alt="UPI QR code, ${inr(r.amount / 100)}">`;
  else {   /* Razorpay payment link ka QR: scan karte hi phone par Razorpay page (amount fixed) */
    try { await loadQrLib(); const q = qrcode(0, "M"); q.addData(r.link); q.make(); $("#qrImg").innerHTML = q.createSvgTag({ cellSize:4, margin:0, alt:`Payment QR, ${inr(r.amount / 100)}` }); }
    catch(e) { $("#qrWrap").hidden = true; $("#qrOr").hidden = true; return; }
    $("#qrLive").textContent = "Phone ke camera se scan karein, payment page khulega · intezaar";
  }
  $("#qrLive").hidden = false;
  pollQr();
}
function loadQrLib(){ return new Promise((ok, no) => { if (window.qrcode) return ok(); const sc = document.createElement("script"); sc.src = "js/qrcode.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
function pollQr(){
  clearTimeout(QR.timer);
  QR.timer = setTimeout(async () => {
    if (!QR.id) return;
    if (Date.now() > QR.until) { $("#qrImg").innerHTML = `<button type="button" class="wait" id="qrNew">QR ka time khatam. Naya QR banane ke liye yahan dabayein</button>`; $("#qrLive").hidden = true; QR.id = ""; return; }
    if (!document.hidden) { const r = await api("customPayStatus", { ...WHO, qrId:QR.id }); if (r.ok && r.paid) return paidNow(r); }
    pollQr();
  }, 4000);
}
document.addEventListener("click", e => { if (e.target.closest("#qrNew")) { $("#qrImg").innerHTML = `<div class="wait">QR ban raha hai…</div>`; makeQr(); } });

function loadRazorpay(){
  return new Promise((ok, no) => { if (window.Razorpay) return ok();
    const s = document.createElement("script"); s.src = "https://checkout.razorpay.com/v1/checkout.js"; s.onload = ok; s.onerror = () => no(new Error("Payment page load nahi hua. Internet check karein.")); document.head.appendChild(s); });
}
const appsBusy = on => document.querySelectorAll("#apps button").forEach(b => b.disabled = on);
document.addEventListener("click", async e => {
  const btn = e.target.closest("#apps [data-app]"); if (!btn || !CUR) return;
  const app = APPS.find(a => a.id === btn.dataset.app);
  appsBusy(true);
  if (isDemo()) { $("#payNote").textContent = "Demo payment…"; await new Promise(r => setTimeout(r, 1000)); return paidNow({ ok:true, paid:true, download:"demo/ppt/photosynthesis.pptx", paymentId:"pay_DEMO123" }); }
  const o = await api("customPayOrder", WHO);
  if (o.ok && o.paid) return paidNow(o);
  if (!o.ok) { appsBusy(false); return toast("⚠ " + o.error); }
  try { await loadRazorpay(); } catch(err) { appsBusy(false); return toast("⚠ " + err.message); }
  const opts = { key:o.key, amount:o.amount, currency:"INR", name:"PPT Store", image:location.origin + "/uploads/brand/logo-200.webp", order_id:o.rzpOrderId, prefill:o.prefill, theme:{ color:"#8b2cff" },
    description:o.title || `Order #${CUR.id}`, modal:{ ondismiss:() => appsBusy(false) },
    handler: async resp => {
      $("#payNote").textContent = "Payment verify ho raha hai…";
      let v = await api("customPayVerify", { ...WHO, ...resp });
      if (!v.ok && v.net) v = await api("customPayVerify", { ...WHO, ...resp });
      appsBusy(false);
      if (!v.ok) { $("#payNote").textContent = "⚠ " + v.error; return toast("⚠ " + v.error); }
      paidNow(v);
    } };
  if (app.rzp) opts.config = { display:{ blocks:{ app:{ name:`Pay with ${app.name}`, instruments:[{ method:"upi", flows:["intent","qr"], apps:[app.rzp] }] } }, sequence:["block.app"], preferences:{ show_default_blocks:false } } };
  const rzp = new Razorpay(opts);
  rzp.on("payment.failed", r => { appsBusy(false); toast("⚠ Payment fail: " + (r.error?.description || "dobara try karein")); });
  rzp.open();
});
/* Payment ho gaya: Order complete + Download */
function paidNow(r){
  stopQr();
  const o = Object.assign({}, CUR, { ppt:null, status:"Paid", download:r.download, paymentId:r.paymentId });
  show.done = true; show(o); show.done = false; LAST = sig(o);
  $("#okbox").scrollIntoView({ behavior:"smooth", block:"center" });
  toast("🎉 Payment successful! Download shuru ho raha hai…");
  setTimeout(() => { const a = $("#dlBtn"); if (a && !isDemo()) a.click(); }, 1200);
}
let toastT; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }
/* Order khula rahe: number + mobile is phone par yaad, refresh / dobara aane par seedha status */
const SAVE = "la_track";
const sig = o => [o.status, o.ppt ? o.ppt.price + "|" + (o.ppt.demo || []).length + "|" + o.ppt.payments : "", o.download || ""].join("~");
async function open_(id, phone, quiet){
  const b = $("#tBtn"); if (!quiet) { b.disabled = true; b.textContent = "Dhoondh rahe hain…"; }
  const r = await track(id, phone); b.disabled = false; b.textContent = "Status dekhein / Track";
  if (!r.ok) { if (quiet && r.net) return setTimeout(() => open_(id, phone, true), 8000);   /* net nahi → thodi der baad */
    $("#find").hidden = false; $("#res").hidden = true; $("#msg").textContent = r.error; return; }
  try { localStorage.setItem(SAVE, JSON.stringify({ id, phone })); } catch(e) {}
  WHO = { id, phone }; LAST = sig(r); $("#find").hidden = true; show.done = quiet; show(r); show.done = false; live();
}
$("#fTrack").onsubmit = e => {
  e.preventDefault();
  const id = $("#tId").value.replace(/\D/g, ""), phone = $("#tPhone").value.replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "");
  if (!id) { $("#msg").textContent = "Order number daalein (jaise 12)."; $("#tId").focus(); return; }
  if (!/^[6-9]\d{9}$/.test(phone)) { $("#msg").textContent = "Sahi 10-digit mobile number daalein."; $("#tPhone").focus(); return; }
  $("#msg").textContent = ""; open_(id, phone);
};
/* Doosra order: form wapas */
document.addEventListener("click", e => { if (!e.target.closest("#other")) return;
  stopLive(); stopQr(); WHO = null; CUR = null; try { localStorage.removeItem(SAVE); } catch(x) {}
  $("#res").hidden = true; $("#find").hidden = false; $("#tId").value = ""; $("#tPhone").value = ""; $("#tId").focus(); });

/* Live: har 15 sec (page khula ho tab) admin ka badlaav yahan apne aap */
let LAST = "", LT = 0;
const stopLive = () => clearTimeout(LT);
function live(){
  stopLive(); if (!WHO || isDemo()) return;
  LT = setTimeout(async () => {
    if (document.hidden || !WHO) return live();
    const r = await track(WHO.id, WHO.phone);
    if (r.ok && WHO && sig(r) !== LAST) {
      const was = CUR ? CUR.status : "", s2 = sig(r); LAST = s2;
      if (!(CUR && CUR.download && !r.download)) { show.done = true; show(r); show.done = false; }
      if ((r.ppt || r.status === "Done") && was !== "Done" && was !== "Paid") ping("🎉 Aapki PPT ready hai!", `Order #${r.id}: demo dekhein aur pay karke download karein.`);
      else if (r.status !== was) ping("Order #" + r.id + " update", STEPS.concat([["Cancelled", "Order cancel ho gaya"]]).find(x => x[0] === r.status)?.[1] || r.status);
    }
    live();
  }, 15000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && WHO && !isDemo()) { stopLive(); liveNow(); } });
async function liveNow(){ const r = await track(WHO.id, WHO.phone); if (r.ok && sig(r) !== LAST) { LAST = sig(r); if (!(CUR && CUR.download && !r.download)) { show.done = true; show(r); show.done = false; } } live(); }

/* Notification: PPT ready / status badle to phone par alert (page band na ho, background tab bhi chalega) */
const canNotify = () => "Notification" in window;
function ping(title, body){
  toast(title);
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e) {}
  try { if (canNotify() && Notification.permission === "granted") { const n = new Notification(title, { body, icon:"/uploads/brand/icon-192.png", tag:"la-track" }); n.onclick = () => { window.focus(); n.close(); }; } } catch(e) {}
  const t0 = document.title; let k = 0; clearInterval(ping.t); ping.t = setInterval(() => { document.title = k++ % 2 ? t0 : "🔔 " + title; if (!document.hidden && k > 6) { clearInterval(ping.t); document.title = t0; } }, 1000);
}
document.addEventListener("click", async e => { const b = e.target.closest("#bell"); if (!b) return;
  if (!canNotify()) return toast("Is browser mein notification nahi chalta. Page khula rakhein, status apne aap badlega.");
  const p = await Notification.requestPermission(); bellUi();
  toast(p === "granted" ? "🔔 Ho gaya! PPT ready hote hi notification aayega." : "Notification band hai. Browser settings se Allow karein."); });
function bellUi(){ const b = $("#bell"); if (!b) return; const on = canNotify() && Notification.permission === "granted";
  b.innerHTML = on ? "🔔 Notification chalu hai: PPT ready hote hi bataenge" : "🔔 PPT ready hone par notification paayein"; b.disabled = on; }

(function(){
  const h = new URLSearchParams(location.hash.slice(1)); let s = {};
  try { s = JSON.parse(localStorage.getItem(SAVE) || "{}"); } catch(e) {}
  const hid = (h.get("id") || "").replace(/\D/g, "");
  $("#tId").value = (hid || s.id || "").replace(/\D/g, ""); if (s.phone) $("#tPhone").value = s.phone;
  if (s.id && s.phone && (!hid || hid === String(s.id))) { $("#find").hidden = true; $("#res").hidden = false; $("#res").innerHTML = `<p style="text-align:center;color:var(--muted)">Order #${esc(s.id)} khul raha hai…</p>`; open_(String(s.id), String(s.phone), true); }
})();
</script>
<script>/* Theme switch: homepage wali choice (la_theme) har page par same */
(function(){
  const root = document.documentElement, mq = matchMedia("(prefers-color-scheme: light)");
  const apply = m => { root.classList.toggle("light", m === "light" || (m === "system" && mq.matches)); root.setAttribute("data-mode", m);
    document.querySelectorAll(".theme-sw button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === m))); };
  apply(root.getAttribute("data-mode") || "system");
  document.querySelectorAll(".theme-sw button").forEach(b => b.onclick = () => { try { localStorage.setItem("la_theme", b.dataset.mode); } catch(e) {} window.name = "la_theme=" + b.dataset.mode; apply(b.dataset.mode); });
  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(() => { if (root.getAttribute("data-mode") === "system") apply("system"); });
})();
</script>
<script>/* Theme button: pehle click par teeno option khulein, chunne par wapas band */
document.addEventListener("click", e => {
  const sw = e.target.closest(".theme-sw");
  document.querySelectorAll(".theme-sw.open").forEach(s => s !== sw && s.classList.remove("open"));
  if (!sw || !e.target.closest("button")) return;
  if (sw.classList.contains("open")) { sw.classList.remove("open"); return; }
  e.stopPropagation(); e.preventDefault(); sw.classList.add("open");
}, true);
</script>
