<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Previous Year Question Papers — PPT Store</title>
<meta name="description" content="State board ke pichhle 10 saal ke question papers — har saal ke sabhi set, PDF me dekhein aur download karein." />
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="96x96" href="/uploads/brand/icon-96.png">
<script>
(function(){var m="system";var w=/(?:^|;)la_theme=(\w+)/.exec(window.name);if(w)m=w[1];else try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.classList.toggle("light",l);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--card:#0f121b;--card2:#151927;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f4f5fb;--muted:#9aa1b8;--c:#f97316}
html.light{--bg:#f6f5fb;--card:#fff;--card2:#f4f3fa;--line:rgba(20,16,40,.08);--line2:rgba(20,16,40,.14);--text:#16131f;--muted:#5d5873}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
 background-image:radial-gradient(600px 300px at 10% -10%,rgba(249,115,22,.14),transparent),radial-gradient(500px 300px at 100% 0,rgba(139,44,255,.12),transparent)}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit;border:0;background:none}
button,select{cursor:pointer}
.wrap{width:min(1180px,100% - 32px);margin:0 auto;padding:0 0 48px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700}
.brand img{height:22px;width:auto}
.back{font-size:.82rem;color:var(--muted);padding:6px 12px;border:1px solid var(--line2);border-radius:99px}
.back:hover{color:var(--text);border-color:var(--c)}

/* Hero banner */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:12px 20px;color:#fff;
 background:linear-gradient(120deg,#f97316 0%,#e8590c 35%,#8b2cff 100%);box-shadow:0 24px 50px -24px rgba(232,89,12,.6)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:220px;height:220px;right:-60px;top:-90px}
.hero::after{width:140px;height:140px;right:120px;bottom:-80px;background:rgba(255,255,255,.08)}
.crumb{position:relative;font-size:.76rem;opacity:.85;display:flex;gap:6px;flex-wrap:wrap}
.crumb a:hover{text-decoration:underline}
.hrow{position:relative;display:flex;align-items:center;gap:12px;margin-top:6px}
.hic{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:1.25rem;border-radius:12px;background:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;line-height:1.15}
.stsel{position:relative;margin-left:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:.78rem;font-weight:700}
.stsel select{height:32px;font-weight:800;outline:0;max-width:150px}
.stsel select option{color:#16131f;background:#fff}
.badges{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.bd{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-size:.74rem;font-weight:700}


/* Saal badlein */
.yb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line2)}
.yb::-webkit-scrollbar{display:none}
.yb a{flex:none;transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:7px 13px;border-radius:9px;font-size:.8rem;font-weight:800;color:var(--muted)}
.yb a:hover{color:var(--text);background:var(--card2)}
.yb a[aria-current="true"]{background:var(--c);color:#fff;box-shadow:0 6px 14px -8px var(--c)}
.lh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:.8rem;color:var(--muted)}
.lh b{color:var(--text)}
/* Set cards */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.set{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .15s,box-shadow .15s,transform .15s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.set:hover{border-color:rgba(229,72,77,.45);box-shadow:0 16px 30px -22px #e5484d;transform:translateY(-1px)}
.set svg{width:34px;height:40px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.set .tx{flex:1;min-width:0}
.set b{display:block;font-size:1rem;font-weight:800;white-space:nowrap}
.set small{color:var(--muted);font-size:.74rem}
.acts{display:flex;gap:6px;flex:none}
.acts a{display:flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:10px;font-size:.78rem;font-weight:800;border:1px solid var(--line2)}
.acts a:hover{border-color:var(--text)}
.acts a.dl{background:linear-gradient(135deg,#ff6b6b,#d62f35);color:#fff;border:0;box-shadow:0 8px 16px -10px #d62f35}
.acts a.dl:hover{filter:brightness(1.08)}
.none{padding:34px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}
.none .big{font-size:2rem}.none b{display:block;color:var(--text);font-size:1rem;margin:4px 0}
.none a{display:inline-block;margin-top:12px;padding:9px 14px;border-radius:11px;background:linear-gradient(135deg,#f97316,#c2410c);color:#fff;font-weight:800;font-size:.82rem}
.help{margin-top:22px;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line2)}
.help .hi{font-size:1.6rem}.help p{flex:1;font-size:.88rem}.help small{display:block;color:var(--muted);font-size:.78rem}
.help a{flex:none;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,#f97316,#c2410c);color:#fff;font-weight:800;font-size:.84rem}
.hsub{position:relative;font-size:.78rem;opacity:.9}
@media (max-width:640px){
 .hero{padding:12px 14px;border-radius:16px}h1{font-size:1.15rem}.hic{width:36px;height:36px;font-size:1.1rem}
 .set{padding:12px}.acts a{padding:0 9px}.acts a span{display:none}
 .help{flex-wrap:wrap}.help a{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){.set{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#d62f35"/></linearGradient></defs></svg>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html"><img src="uploads/brand/logo.webp" alt="PPT Store logo" width="50" height="22">PPT Store</a>
    <a class="back" id="bk" href="state-board.html">← Wapas</a>
  </div>
  <section class="hero">
    <div class="crumb"><a href="index.html">Home</a>›<a href="state-books.html">State Books</a>›<a id="crSt" href="#"></a>›<span>Previous Year</span></div>
    <div class="hrow">
      <span class="hic">🗂️</span>
      <div><h1 id="ttl"></h1><div class="hsub" id="hsub"></div></div>
    </div>
  </section>
  <nav class="yb" id="yb" aria-label="Saal"></nav>
  <div class="lh"><span id="cnt"></span></div>
  <div class="sets" id="sets"></div>
  <div class="help"><span class="hi">💬</span><p>Kisi aur saal ya set ka paper chahiye?<small>Hume batayein, hum aapke liye la denge.</small></p><a href="index.html#custom">Request karein →</a></div>
</div>
<script src="js/state-files.js"></script>
<script>
(function(){
const qs=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const _d=new Date(),LAST=_d.getMonth()>=2?_d.getFullYear():_d.getFullYear()-1,YEARS=Array.from({length:10},(_,i)=>LAST-i);
const P={s:qs.get("s")||"Bihar",c:qs.get("c")||"10",m:qs.get("m")==="English"?"English":"Hindi",sub:qs.get("sub")||"English"};
let y=YEARS.includes(+qs.get("y"))?+qs.get("y"):LAST,sets=[];
const T="Previous Year Questions",NEWTAB=window.self===window.top?' target="_blank" rel="noopener"':"";
const board="state-board.html?"+new URLSearchParams({s:P.s,t:T,c:P.c,m:P.m});
$("bk").href=board;$("crSt").href=board;$("crSt").textContent=P.s;
$("hsub").textContent=`${P.s} Board · Class ${P.c} · ${P.m} Medium`;
$("yb").innerHTML=YEARS.map(v=>`<a href="?${new URLSearchParams({...P,y:v})}" data-y="${v}">${v}</a>`).join("");
const ic=`<svg viewBox="0 0 34 40"><path d="M4 0h18l12 12v24a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="url(#gP)"/><path d="M22 0v8a4 4 0 0 0 4 4h8z" fill="#fff" opacity=".5"/><text x="15" y="30" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans,Arial" font-weight="800" font-size="9">PDF</text></svg>`;
const fname=n=>`${P.s} Class ${P.c} ${P.sub} ${y} Paper Set ${n} ${P.m}`.replace(/[^\w\- ]+/g,"").trim()+".pdf";
function render(){
 $("ttl").textContent=`${P.sub} — ${y} Question Paper`;
 document.title=`${P.s} Board Class ${P.c} ${P.sub} ${y} Question Paper — PPT Store`;
 $("yb").querySelectorAll("a").forEach(a=>a.setAttribute("aria-current",+a.dataset.y===y));
 const rec=(window.STATE_FILES||{})[[P.s,T,P.c,P.m,P.sub,y].join("|")]||{};sets=(rec.sets||[]).filter(Boolean);
 $("cnt").innerHTML=sets.length?`<b>${sets.length}</b> set · ${y}`:"";
 $("sets").innerHTML=sets.length?sets.map((u,i)=>`<div class="set">${ic}<div class="tx"><b>Set ${i+1}</b><small>${y} · PDF</small></div><div class="acts"><a${NEWTAB} href="view.html?${new URLSearchParams({...P,t:T,f:"PDF",y,set:i+1})}" title="Dekhein">👁<span> Dekhein</span></a><a class="dl" href="${esc(u)}" data-i="${i}" title="PDF download">⬇<span> PDF</span></a></div></div>`).join("")
  :`<div class="none" style="grid-column:1/-1"><div class="big">📂</div><b>${y} ke paper jaldi aa rahe hain</b>Is saal ke ${esc(P.sub)} ke question paper abhi upload nahi hue hain.<br><a href="index.html#custom">Request karein →</a></div>`;
 try{history.replaceState(null,"","?"+new URLSearchParams({...P,y}));}catch(_){}
}
/* Saal badalna — page reload ke bina, turant */
$("yb").addEventListener("click",e=>{const a=e.target.closest("a[data-y]");if(!a)return;e.preventDefault();if(+a.dataset.y===y)return;y=+a.dataset.y;render();a.scrollIntoView({inline:"nearest",block:"nearest",behavior:"smooth"});});
render();
{const cur=$("yb").querySelector('[aria-current="true"]');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});}
/* Download: file seedha save */
async function getBlob(u){
 if(u.startsWith("data:")){const i=u.indexOf(","),mt=u.slice(5,i).split(";")[0],b=atob(u.slice(i+1)),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return new Blob([a],{type:mt});}
 const r=await fetch(u);if(!r.ok)throw 0;return r.blob();
}
$("sets").addEventListener("click",async e=>{const a=e.target.closest("a.dl");if(!a)return;e.preventDefault();
 const u=sets[+a.dataset.i],abs=u.startsWith("data:")?u:new URL(u,location.href).href,nm=fname(+a.dataset.i+1),t=a.innerHTML;a.innerHTML="⏳<span> …</span>";
 try{const bl=await getBlob(abs);
  if(window.self!==window.top&&window.claude&&claude.use){const dw=await claude.use("downloads").catch(()=>null);if(dw){await dw.save({filename:nm,data:bl}).catch(()=>{});return;}}
  const b=URL.createObjectURL(bl),x=document.createElement("a");x.href=b;x.download=nm;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(b),4e4);}
 catch(_){if(window.self===window.top)window.open(abs,"_blank","noopener");else location.href=abs;}
 finally{a.innerHTML=t;}
});
})();
</script>
</body>
</html>
