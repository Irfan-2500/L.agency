<style>
/* Same look as the main website: dark + RGB glow */
/* Same look as the main website: dark + RGB glow */
@property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#07080c;--bg2:#0b0d14;--card:#0f121b;--card2:#141826;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#f4f5fb;--muted:#9aa1b8;--dim:#6b7290;--green:#22c55e;--amber:#ffb020;--violet:#c084fc;--cyan:#22d3ee;
  --rgb:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00ff88,#00e5ff,#3d5afe,#d500f9,#ff004c);
  --rgb-conic:conic-gradient(from var(--angle),#ff004c,#ff8a00,#ffe600,#00ff88,#00e5ff,#3d5afe,#d500f9,#ff004c);
  --display:'Space Grotesk',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
@keyframes spin{to{--angle:360deg}}
@keyframes flow{to{background-position:200% 50%}}
@keyframes shine{0%{left:-80%}55%,100%{left:130%}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 15% 10%,rgba(213,0,249,.18),transparent 40%),radial-gradient(circle at 85% 90%,rgba(0,229,255,.14),transparent 40%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid #00e5ff;outline-offset:2px}
.wrap{width:min(1040px,100%);margin:0 auto;padding-block:20px 56px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:30px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;border:1.5px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--rgb-conic) border-box;animation:spin 4s linear infinite;box-shadow:0 0 18px rgba(139,44,255,.45)}
.logo b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1}
.logo b span,.rgb{background:var(--rgb);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.logo small{font-size:.6rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);font-size:.85rem;font-weight:600;color:var(--muted);transition:.2s}
.back:hover{color:var(--text);border-color:var(--violet)}

/* hero */
.hero{text-align:center;padding:26px 0 40px;max-width:780px;margin:0 auto}
.eyebrow{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
.hero h1{font-family:var(--display);font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.hero .tag{margin-top:16px;font-size:clamp(1rem,2.4vw,1.2rem);font-weight:700;color:var(--amber)}
.hero .tag span{color:var(--dim);margin:0 6px}

/* sections */
section{margin-top:22px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 28px}
.card.glow{border:0;box-shadow:0 30px 80px -30px rgba(213,0,249,.5)}
.card.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:var(--rgb-conic);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
h2{font-family:var(--display);font-size:clamp(1.45rem,3.4vw,1.9rem);line-height:1.2;margin-bottom:14px}
h3{font-family:var(--display);font-size:1.02rem;line-height:1.3;margin-bottom:6px}
.prose p{color:var(--muted);max-width:72ch}
.prose p+p{margin-top:12px}
.prose p.lead{color:var(--text);font-size:1.05rem}
.pull{margin:22px 0 0;padding:14px 18px;border-left:3px solid var(--violet);background:rgba(139,44,255,.10);border-radius:0 12px 12px 0;font-weight:700;font-size:1.02rem;color:var(--text)}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
/* founder */
.founder{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.f-av{position:relative;isolation:isolate;flex-shrink:0;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.3rem;color:#fff;
  background:linear-gradient(135deg,#8b2cff,#d500f9 55%,#06b6d4);box-shadow:0 0 0 4px var(--card),0 0 0 6px transparent,0 0 40px rgba(213,0,249,.55)}
.f-av::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--rgb-conic);animation:spin 4s linear infinite;z-index:-1}
.f-body{flex:1;min-width:240px}
.f-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35)}
.f-body h2{margin:10px 0 2px;font-size:clamp(1.7rem,4.5vw,2.4rem)}
.f-role{font-weight:700;color:var(--muted)}
.f-body p.f-txt{color:var(--muted);margin-top:12px;max-width:62ch}
.f-body p.f-txt b{color:var(--text)}
.f-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.f-stats span{padding:8px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);font-size:.82rem;font-weight:700}
@media(max-width:560px){.founder{flex-direction:column;text-align:center}.f-stats{justify-content:center}.f-body p.f-txt{margin-inline:auto}}
.sec-head{text-align:center;max-width:680px;margin:48px auto 22px}
.sec-head p{color:var(--muted)}

/* grids of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:.25s}
.item:hover{border-color:rgba(192,132,252,.5);transform:translateY(-3px)}
.item p{color:var(--muted);font-size:.9rem}
.item p+p{margin-top:8px}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;margin-bottom:12px;font-family:var(--display);font-weight:700;font-size:.85rem;color:#fff;
  background:linear-gradient(135deg,#8b2cff,#06b6d4)}
.ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;margin-bottom:12px;color:var(--c,#c084fc);border:1px solid color-mix(in srgb,var(--c,#c084fc) 50%,transparent);background:color-mix(in srgb,var(--c,#c084fc) 12%,transparent)}
.ic svg{width:19px;height:19px}
.note-line{text-align:center;color:var(--muted);margin-top:18px;max-width:70ch;margin-inline:auto}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.step .num{margin:0;flex-shrink:0;width:36px;height:36px}
.step small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:2px}
.step p{color:var(--muted);font-size:.9rem}

/* CTA */
.cta{text-align:center;margin-top:48px}
.cta h2{margin-bottom:8px}
.cta p{color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:700;font-size:.92rem;border:1px solid var(--line2);background:var(--card2);transition:.2s}
.btn:hover{border-color:var(--violet)}
.btn.pri{border:0;color:#fff;background:linear-gradient(90deg,#8b2cff,#d500f9,#06b6d4,#8b2cff);background-size:300% auto;animation:flow 6s linear infinite;box-shadow:0 10px 34px -8px rgba(213,0,249,.7)}
.btn.pri::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite}
.btn.wa{border:0;color:#fff;background:#16a34a;box-shadow:0 8px 22px -8px rgba(34,197,94,.7)}
.btn.wa:hover{filter:brightness(1.1)}
.foot{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--dim)}
.foot a:hover{color:var(--text)}

@media(max-width:820px){.two{grid-template-columns:1fr}}
@media(max-width:480px){.card{padding:24px 18px}.top .back span{display:none}.hero .tag span{display:block;height:0;overflow:hidden}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Light theme (main website par chuna gaya theme yahan bhi lagta hai) */
html.light{color-scheme:light;--bg:#f5f4fa;--bg2:#ecebf5;--card:#ffffff;--card2:#f1effa;--line:rgba(40,30,90,.10);--line2:rgba(40,30,90,.17);
  --text:#16142a;--muted:#57557a;--dim:#8987a6;--amber:#d97706;--violet:#7c3aed;--cyan:#0891b2;
  --rgb:linear-gradient(90deg,#e0115f,#ea580c,#ca8a04,#059669,#0284c7,#4f46e5,#a21caf,#e0115f);
  --rgb-conic:conic-gradient(from var(--angle),#e0115f,#ea580c,#ca8a04,#059669,#0284c7,#4f46e5,#a21caf,#e0115f)}
html.light body{background-image:radial-gradient(circle at 15% 10%,rgba(213,0,249,.10),transparent 40%),radial-gradient(circle at 85% 90%,rgba(0,180,220,.10),transparent 40%),
  linear-gradient(rgba(40,30,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(40,30,90,.045) 1px,transparent 1px)}
html.light .card.glow{box-shadow:0 26px 60px -28px rgba(110,40,220,.45)}
html.light .pull{background:rgba(139,44,255,.07)}

/* ---------- More Offerings page ---------- */
.svc-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 14px;margin-bottom:10px}
.svc-tabs::-webkit-scrollbar{display:none}
.svc-tabs a{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;font-size:.84rem;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line2);transition:.18s}
.svc-tabs a svg{color:var(--c)}
.svc-tabs a:hover{color:var(--text);border-color:var(--c)}
.svc-tabs a.on{color:#fff;border-color:transparent;background:var(--c);box-shadow:0 8px 22px -8px var(--c)}
.svc-tabs a.on svg{color:#fff}
.svc-hero{position:relative;text-align:center;padding:30px 20px 34px;margin-bottom:18px;border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),var(--card);border:1px solid var(--line)}
.svc-ic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;color:#fff;background:var(--c);box-shadow:0 14px 34px -10px var(--c);margin-bottom:14px}
.svc-ic svg{width:30px;height:30px}
.svc-ic.sm{width:40px;height:40px;border-radius:12px;margin:0;box-shadow:none}
.svc-ic.sm svg{width:20px;height:20px}
.svc-hero h1{font-family:var(--display);font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.svc-hero .tag{margin-top:10px;font-size:1.08rem;font-weight:700;color:var(--c)}
.svc-hero .intro{margin:12px auto 0;max-width:62ch;color:var(--muted)}
.plats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.plats span{padding:6px 14px;border-radius:99px;font-size:.82rem;font-weight:700;background:var(--card2);border:1px solid var(--line2)}
.svc-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.svc-grid section,main>section{margin-top:0}
main{display:flex;flex-direction:column;gap:18px}
.card h2{font-size:1.3rem;margin-bottom:14px}
.ticks{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.ticks.who{grid-template-columns:1fr}
.ticks li{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.93rem}
.ticks li svg{flex-shrink:0;margin-top:2px;color:var(--green);width:18px;height:18px}
.price-note{margin-top:18px;padding:12px 14px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.price-note span{color:var(--muted)}
.more-h{font-size:1.2rem;margin:6px 0 12px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.more a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.18s}
.more a b{flex:1;font-size:.92rem}
.more a>svg{color:var(--dim)}
.more a:hover{border-color:var(--c);transform:translateY(-2px)}
.cta.card{text-align:center;margin-top:0}
.svc-hero .svc-ic{display:grid;margin:0 auto 14px}
.svc-hero .eyebrow{display:block}
main section{margin-top:0}
@media(max-width:820px){.svc-grid{grid-template-columns:1fr}.ticks{grid-template-columns:1fr}}
</style>

      <section class="card"><h2>What we offer</h2><ul class="ticks">${s.what.map(x => `<li>${icon("i-check")}<span>${esc(x)}</span></li>`).join("")}</ul></section>
      <section class="card"><h2>Who it's for</h2><ul class="ticks who">${s.who.map(x => `<li>${icon("i-check")}<span>${esc(x)}</span></li>`).join("")}</ul>

    <section><h2 class="more-h">Other offerings</h2><div class="more">${others.map(x => `<a href="service.html?s=${x.id}" style="--c:${x.c}"><span class="svc-ic sm">${icon(x.icon)}</span><b>${esc(x.name)}</b>${icon("i-right")}</a>`).join("")}</div></section>`;
}
const $tabs = document.getElementById("svcTabs"), $svc = document.getElementById("svc");

document.addEventListener("click", e => { const a = e.target.closest('a[href^="service.html?s="]'); if (!a || e.ctrlKey || e.metaKey) return; e.preventDefault(); history.pushState(null, "", a.getAttribute("href")); render(); scrollTo({ top: 0, behavior: "smooth" }); });
