<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All State Board Books &amp; Papers — PPT Store</title>
<meta name="description" content="State board ki Syllabus, Book &amp; Answers, Previous Year Questions, Practice Questions aur Model Paper — Class 1 se 12, Hindi / English, PDF, Word aur PPT me." />
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="96x96" href="/uploads/brand/icon-96.png">
<script>
(function(){var m="system";var w=/(?:^|;)la_theme=(\w+)/.exec(window.name);if(w)m=w[1];else try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.classList.toggle("light",l);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--card:#0f121b;--card2:#151927;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f4f5fb;--muted:#9aa1b8;--c:#f97316}
html.light{--bg:#f6f5fb;--card:#fff;--card2:#f4f3fa;--line:rgba(20,16,40,.08);--line2:rgba(20,16,40,.14);--text:#16131f;--muted:#5d5873}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
 background-image:radial-gradient(600px 300px at 10% -10%,rgba(249,115,22,.14),transparent),radial-gradient(500px 300px at 100% 0,rgba(139,44,255,.12),transparent)}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit;border:0;background:none}
button,select{cursor:pointer}
.wrap{width:min(1180px,100% - 32px);margin:0 auto;padding:0 0 48px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700}
.brand img{height:22px;width:auto}
.back{font-size:.82rem;color:var(--muted);padding:6px 12px;border:1px solid var(--line2);border-radius:99px}
.back:hover{color:var(--text);border-color:var(--c)}

/* Hero banner */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:12px 20px;color:#fff;
 background:linear-gradient(120deg,#f97316 0%,#e8590c 35%,#8b2cff 100%);box-shadow:0 24px 50px -24px rgba(232,89,12,.6)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:220px;height:220px;right:-60px;top:-90px}
.hero::after{width:140px;height:140px;right:120px;bottom:-80px;background:rgba(255,255,255,.08)}
.crumb{position:relative;font-size:.76rem;opacity:.85;display:flex;gap:6px;flex-wrap:wrap}
.crumb a:hover{text-decoration:underline}
.hrow{position:relative;display:flex;align-items:center;gap:12px;margin-top:6px}
.hic{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:1.25rem;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;line-height:1.15}
.stsel{position:relative;margin-left:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:.78rem;font-weight:700}
.stsel select{height:32px;font-weight:800;outline:0;max-width:150px}
.stsel select option{color:#16131f;background:#fff}
.badges{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.bd{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-size:.74rem;font-weight:700}

/* State grid */
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 14px}
.bar .cnt{font-size:.82rem;color:var(--muted)}.bar .cnt b{color:var(--text)}
.q{margin-left:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line2);width:260px}
.q svg{width:15px;height:15px;flex:none;stroke:var(--muted)}
.q input{width:100%;outline:0;font-size:.84rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:.18s;animation:up .35s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.st:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 16px 30px -22px var(--c);transform:translateY(-2px)}
.ab{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:13px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.95rem;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.st div{flex:1;min-width:0}
.st b{display:block;font-size:.98rem;font-weight:800}
.st small{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.go{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--c);border:1px solid var(--line2);transition:.15s;font-weight:800}
.st:hover .go{background:var(--c);color:#fff;border-color:var(--c)}
.none{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}
@media (max-width:640px){
 .hero{padding:12px 14px;border-radius:16px}
 h1{font-size:1.2rem}.hic{width:36px;height:36px;font-size:1.1rem}
 .bar{flex-wrap:wrap}.q{width:100%;margin-left:0;order:-1}
 .grid{grid-template-columns:1fr 1fr;gap:8px}
 .st{padding:10px;gap:8px}.ab{width:34px;height:34px;font-size:.78rem;border-radius:10px}
 .st b{font-size:.85rem}.st small{display:none}.go{display:none}
}
@media (prefers-reduced-motion:reduce){.st{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="srch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html"><img src="uploads/brand/logo.webp" alt="PPT Store logo" width="50" height="22">PPT Store</a>
    <a class="back" href="index.html">← Home</a>
  </div>
  <section class="hero">
    <div class="crumb"><a href="index.html">Home</a>›<b>State Books</b></div>
    <div class="hrow"><span class="hic">🗺️</span><div><h1>State Books</h1></div></div>
  </section>
  <div class="bar">
    <span class="cnt" id="cnt"></span>
    <label class="q"><svg><use href="#srch"/></svg><input id="q" type="search" placeholder="State / board dhoondhein…" aria-label="State search"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
const STATES=["Bihar","UP","Andhra Pradesh","Chhattisgarh","West Bengal","Gujarat","Karnataka","Kerala","Madhya Pradesh","Haryana","Maharashtra","Punjab","Rajasthan","Tamilnadu","Jharkhand","Telangana","CISCE","NIOS","Odisha","Assam","Jammu & Kashmir"];
const PAL=[["#f97316","#c2410c"],["#8b2cff","#5b21b6"],["#0ea5e9","#0369a1"],["#16a34a","#15803d"],["#db2777","#9d174d"],["#ca8a04","#a16207"],["#0d9488","#0f766e"],["#4f46e5","#3730a3"]];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const ab=x=>{const w=x.replace("&","").split(/\s+/).filter(Boolean);return (w.length>1?w[0][0]+w[1][0]:x.slice(0,2)).toUpperCase();};
const g=document.getElementById("grid"),q=document.getElementById("q"),cnt=document.getElementById("cnt");
function render(){const k=q.value.trim().toLowerCase(),f=STATES.filter(x=>!k||x.toLowerCase().includes(k));
 cnt.innerHTML=`<b>${f.length}</b> state boards`;
 g.innerHTML=f.length?f.map((x,i)=>{const [a1,a2]=PAL[STATES.indexOf(x)%PAL.length];
  return `<a class="st" href="state-board.html?s=${encodeURIComponent(x)}" style="--a1:${a1};--a2:${a2};animation-delay:${i*25}ms" data-ui="state_all"><span class="ab">${esc(ab(x))}</span><div><b>${esc(x)}</b><small>Syllabus · Books · PYQ · Papers</small></div><span class="go">›</span></a>`}).join("")
  :`<div class="none">"${esc(q.value)}" naam ka board nahi mila.</div>`;}
q.oninput=render;render();
})();
</script>
</body>
</html>
