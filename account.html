<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account (My PPTs + Orders) — PPT Store</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="48x48" href="/uploads/brand/icon-48.png"><link rel="icon" type="image/png" sizes="96x96" href="/uploads/brand/icon-96.png"><link rel="icon" type="image/png" sizes="192x192" href="/uploads/brand/icon-192.png"><link rel="apple-touch-icon" href="uploads/brand/apple-touch-icon.png">
<script>
/* Theme: homepage wali setting yahan bhi lagti hai */
(function(){var m="system";var w=/(?:^|;)la_theme=(\w+)/.exec(window.name);if(w)m=w[1];else try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
var r=document.documentElement;r.classList.toggle("light",l);r.setAttribute("data-mode",m);})();
</script>
<meta name="description" content="Sign in to access and re-download your purchased PPTs anytime." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== COLORS (homepage jaise) ===== */
:root{
  --bg:#07080c; --bg2:#0b0d14; --card:#0f121b; --card2:#141826;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f4f5fb; --muted:#9aa1b8; --dim:#6b7290;
  --violet:#8b2cff; --cyan:#06b6d4; --pink:#ec4899; --green:#22c55e; --amber:#f59e0b; --gold:#fde047;
  --grad:linear-gradient(90deg,#8b2cff,#06b6d4);
  --shadow:0 20px 60px -20px rgba(139,44,255,.45);
}
html.light{
  --bg:#f6f5fb; --bg2:#eeedf6; --card:#ffffff; --card2:#f3f2fa;
  --line:rgba(20,16,40,.09); --line2:rgba(20,16,40,.16);
  --text:#16131f; --muted:#5d5873; --dim:#8a85a0; --shadow:0 18px 40px -22px rgba(139,44,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk','Hind',sans-serif;line-height:1.2;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.container{width:min(1240px,100% - 32px);margin-inline:auto}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#fde047,#f59e0b);color:#1a1200}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--card2);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-wa{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#22c55e}
.btn-sm{padding:9px 12px;font-size:.82rem;border-radius:10px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box}
.logo b{font-family:'Space Grotesk';font-size:1rem;display:block;line-height:1}
.logo small{font-size:.58rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.back{margin-left:auto;color:var(--muted);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px}
.back:hover{color:var(--text);background:var(--card2)}

/* ===== MY PPTs ===== */
main{padding:40px 0 70px}
.box{width:min(440px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.box h1{font-size:1.5rem} .box p{color:var(--muted);font-size:.9rem}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(139,44,255,.15);color:#c084fc}
.ic svg{width:26px;height:26px}
label{display:grid;gap:6px;font-size:.84rem;font-weight:700}
input{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;font-size:1rem;width:100%}
input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,44,255,.2)}
.otp{letter-spacing:.5em;text-align:center;font-size:1.3rem;font-weight:800}
input::placeholder{color:var(--dim);opacity:.7;font-weight:500}
input:focus-visible{outline:none}
.en{display:block;font-size:.8rem;color:var(--dim);margin-top:3px}
.btn{width:100%}
.links{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.links button{color:var(--cyan);font-weight:700} .links button:disabled{color:var(--dim);cursor:default}
.box .msg{font-size:.84rem;font-weight:600;color:#ef4444;min-height:1.2em}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:1.6rem} .top p{color:var(--muted);font-size:.9rem}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto} .top .btn{width:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.thumb{aspect-ratio:16/9;background:var(--card2) center/cover}
.item .b{padding:14px;display:grid;gap:10px}
.item b{font-family:'Space Grotesk','Hind';font-size:1rem;line-height:1.3}
.item small{color:var(--muted);font-size:.78rem;font-weight:600}
.congrats{display:flex;gap:14px;align-items:center;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.congrats>span{font-size:2rem} .congrats b{font-size:1.05rem} .congrats p{color:var(--muted);font-size:.88rem;margin-top:2px}
.item.new{border-color:var(--gold);box-shadow:0 0 0 2px rgba(253,224,71,.35)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;display:grid;gap:14px;justify-items:center}
.empty .btn{width:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Dark / Light / System switch (homepage jaisa) */
.theme-sw{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line2);flex:none}
.theme-sw button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:9px;color:var(--muted);transition:.2s;background:none;border:0;cursor:pointer}
.theme-sw button svg{width:16px;height:16px}
.theme-sw button:hover{color:var(--text);background:var(--card2)}
.theme-sw button[aria-checked="true"]{color:#fff;background:linear-gradient(135deg,#8b2cff,#06b6d4);box-shadow:0 0 12px rgba(139,44,255,.45)}
@media(max-width:420px){.theme-sw button{width:28px}}
@media(max-width:560px){.nav{gap:8px}.logo b{white-space:nowrap;font-size:.92rem}.logo small{display:none}.back{padding:8px 4px;font-size:.8rem;white-space:nowrap}}
@media(max-width:420px){.back{font-size:0;padding:8px}.theme-sw button{width:27px}}
/* Theme: band rahe to sirf chuni hui theme dikhe, click par teeno khulein */
.theme-sw:not(.open) button:not([aria-checked="true"]){display:none}
/* Theme sirf Home page par chuni jaati hai; baaki pages wahi theme follow karte hain */
.theme-sw{display:none!important}
/* Chhota account page: abhi ka order upar, kharidi PPTs, purane orders band list mein */
.alt-in{justify-self:center;color:var(--cyan);font-weight:700;font-size:.85rem}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}.av svg{width:22px;height:22px}
.top{margin-bottom:12px}.top h1{font-size:1.3rem}.top p{font-size:.82rem}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.qk a{padding:7px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--card);border:1px solid var(--line2);cursor:pointer}.qk a:hover{border-color:var(--violet)}
.sh{font-size:1.05rem;margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}.sh small{color:var(--muted);font-size:.78rem;font-weight:600}
.oc{display:grid;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 16px}
.oc .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.oc .r1 b{font-size:1rem}.oc .r1 small{color:var(--muted);font-size:.78rem;font-weight:600}
.oc .tp{font-weight:600;font-size:.9rem}
.ost{margin-left:auto;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);white-space:nowrap}.ost.ready{color:#1a1200;background:#fde047;border-color:transparent}.ost.paid{color:#052e16;background:#4ade80;border-color:transparent}.ost.cx{color:#fff;background:#ef4444;border-color:transparent}
.dots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.dots i{height:5px;border-radius:9px;background:var(--line2)}.dots i.on{background:linear-gradient(90deg,#22c55e,#06b6d4)}
.oc .btn{width:auto;justify-self:start}
.olist{margin-top:10px}.olist summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--violet);list-style:none}.olist summary::-webkit-details-marker{display:none}.olist summary::after{content:" ▾"}.olist[open] summary::after{content:" ▴"}
.olist a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.84rem}
.olist a b{color:var(--muted)}.olist a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px dashed var(--line2);color:var(--muted);font-size:.85rem}.nudge .btn{width:auto;margin-left:auto}
.list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.item .b{padding:12px;gap:8px}.item b{font-size:.92rem}
/* ===== Dashboard ===== */
main:has(#mine:not([hidden])){padding-top:22px}
.dash{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.dnav{display:grid;gap:4px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line2);position:sticky;top:84px}
.dnav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;text-align:left;color:var(--text);background:none;border:0;cursor:pointer;font:inherit}
.dnav button:hover{background:var(--card2)}.dnav button.on{background:linear-gradient(135deg,rgba(139,44,255,.16),rgba(6,182,212,.14));box-shadow:inset 0 0 0 1px rgba(139,44,255,.4)}
.dnav i{font-style:normal;font-size:1rem;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--card2);flex:none}
.dnav span{min-width:0;flex:1}.dnav b{display:block;font-size:.88rem}.dnav small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav em{font-style:normal;font-size:.7rem;font-weight:800;min-width:22px;text-align:center;padding:2px 6px;border-radius:99px;background:var(--card2);border:1px solid var(--line2)}.dnav em.hot{background:#ef4444;color:#fff;border-color:transparent}
.dpane{min-width:0;padding:16px 18px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
.ph{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}.pback{display:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--text);cursor:pointer;font-weight:800}
.dpane .sh{font-size:.98rem;margin:16px 0 8px}.dpane .sh:first-of-type{margin-top:0}
.more{margin-top:10px;color:var(--violet);font-weight:700;font-size:.85rem;background:none;border:0;cursor:pointer}
.fs{margin-bottom:12px}
.nl{display:grid;gap:6px}.ni{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}.ni:hover{border-color:var(--violet)}
.ni i{font-style:normal;font-size:1.2rem}.ni b{display:block;font-size:.88rem}.ni small{color:var(--muted);font-size:.76rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:12px}.hint a{color:var(--cyan);font-weight:700}
.ol{display:grid;gap:6px;margin-top:12px}.ol>a,.ol>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:.85rem}
.ol>a:hover{border-color:var(--violet)}.ol b{color:var(--muted)}.ol em{display:block;font-style:normal;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ol small{color:var(--muted);font-size:.74rem}.ol span{min-width:0}
.pl .amt{display:grid;justify-items:end;gap:4px;font-weight:800}.rcpt{font-size:.72rem;font-weight:700;color:var(--cyan);background:none;border:0;cursor:pointer}
.setf{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.setf label{flex:1;min-width:200px}.setf .btn{width:auto}
.sr{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.sr span{flex:1;min-width:0}.sr b{display:block;font-size:.9rem}.sr small{color:var(--muted);font-size:.78rem}.sr .btn{width:auto}
.faq{display:grid;gap:6px}.faq details{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}.faq summary{cursor:pointer;font-weight:700;font-size:.88rem}.faq p{margin-top:6px;color:var(--muted);font-size:.84rem}
.hl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.hl a{padding:8px 13px;border-radius:99px;font-size:.82rem;font-weight:700;background:var(--bg2);border:1px solid var(--line2)}.hl a:hover{border-color:var(--violet)}
a.item{color:inherit}
.cthumb{display:grid;place-items:center;background:linear-gradient(135deg,#8b2cff,#06b6d4)}.cthumb span{color:#fff;font-weight:800;font-size:.9rem}
/* Phone: pehle 9 tiles (3x3), tile dabane par us hisse ka page, ← se wapas tiles */
@media(max-width:760px){
  .dash{grid-template-columns:1fr}.dnav{position:static;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;background:none;border:0}
  .dnav button{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 6px;border:1px solid var(--line2);background:var(--card);position:relative;min-height:78px}
  .dnav button.on{box-shadow:none}.dnav i{width:38px;height:38px;font-size:1.3rem}.dnav b{font-size:.74rem;line-height:1.2}.dnav small{display:none}
  .dnav em{position:absolute;top:6px;right:6px}
  body:not([data-view="menu"]) .dnav{display:none}body[data-view="menu"] .dpane{display:none}
  .pback{display:grid;place-items:center}.dpane{padding:14px}.dpane .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dpane .item .b{padding:10px}.dpane .item b{font-size:.8rem}.dpane .item .btn{font-size:.74rem;padding:7px 4px}
}
.otp-note{display:inline-block;margin:6px 0 2px;padding:4px 10px;border-radius:9px;font-weight:800;color:#7c2d12;background:linear-gradient(135deg,#fde68a,#fbbf24);box-shadow:0 0 0 2px rgba(251,191,36,.35);animation:otpPulse 1.6s ease-in-out infinite;transform-origin:left center}
@keyframes otpPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 0 0 5px rgba(251,191,36,.25)}}
@media(prefers-reduced-motion:reduce){.otp-note{animation:none}}
</style>
<script src="js/protect.js"></script>
</head>

<script>
/* demo sirf preview ke liye; live website par kabhi nahi */

const dlUrl = u => { const m = /drive\.google\.com\/.*(?:[?&]id=|\/d\/)([\w-]{20,})/.exec(u || ""); return m ? `https://drive.usercontent.google.com/download?id=${m[1]}&export=download&confirm=t` : u; };

/* Google Script (admin panel wali PPTs): login OTP email par, token isi browser mein */
const SCRIPT = String((window.LA_CONFIG || {}).orderUrl || "").trim();
let SAPI = false;
const tok = v => { try { if (v === undefined) return localStorage.getItem("la_acct") || ""; v ? localStorage.setItem("la_acct", v) : localStorage.removeItem("la_acct"); } catch(e) { return ""; } };
async function sapi(fields){
  const a = !fields ? "acctMe" : { send:"acctSend", login:"acctSend", verify:"acctVerify" }[fields.action];
  if (fields && fields.action === "logout") { tok(""); return { ok:true }; }
  const body = !fields ? { token:tok() } : { id:fields.id, otp:fields.otp, website:fields.website, device:/Mobi|Android|iPhone/i.test(navigator.userAgent) ? "Mobile" : "Computer" };
  try {
    const r = await fetch(SCRIPT, { method:"POST", body:JSON.stringify({ action:a, ...body }), headers:{ "Content-Type":"text/plain;charset=utf-8" } });
    const j = await r.json();
    if (j.token) tok(j.token);
    if (!fields && j.ok && !j.loggedIn) tok("");
    return j.ok ? j : { ok:false, error:j.error || "Something went wrong. Please try again." };
  } catch(e) { return { ok:false, error:"Please check your internet connection and try again.", offline:true }; }
}
async function api(fields){
  if (SAPI) return sapi(fields);
  if (!API) return demoApi(fields);
  try {
    const r = await (fields ? fetch("api/account.php", { method:"POST", body:Object.entries(fields).reduce((f,[k,v]) => (f.append(k,v), f), new FormData()), headers:{ Accept:"application/json" } })
                            : fetch("api/account.php", { headers:{ Accept:"application/json" }, cache:"no-store" }));
    const j = await r.json(); return j.ok ? j : { ok:false, error:j.error || "Something went wrong. Please try again." };
  } catch(e) { return { ok:false, error:"Please check your internet connection and try again.", offline:true }; }
}
/* Preview (bina server) */
let demoIn = false;
function demoApi(f){
  const DEMO = { 1:["Photosynthesis — Class 10 Science","photosynthesis"], 2:["भारत का संविधान — Class 8 SST","samvidhan"], 3:["Newton's Laws of Motion — Class 9","newton"],
                 4:["Fractions Made Easy — Class 5 Maths","fractions"], 5:["Startup Business Plan Pitch Deck","pitch"] };
  const ids = (new URLSearchParams(location.search).get("ids") || "1,3").split(",").filter(i => DEMO[i]);
  const items = ids.map(i => ({ id:+i, title:DEMO[i][0], thumb:`uploads/previews/demo-${DEMO[i][1]}-1.webp`, orderId:"Demo", date:new Date().toISOString(), url:"#demo", slug:DEMO[i][1] }));
  if (!f) return demoIn ? { ok:true, loggedIn:true, phone:phone.includes("@") ? phone.replace(/^(.).*@/,"$1***@") : "******" + phone.slice(-4), items } : { ok:true, loggedIn:false, otp:true };
  if (f.action === "login") { demoIn = true; return demoApi(); }
  if (f.action === "send") return { ok:true, via:"email", to:(phone.includes("@") ? phone.replace(/^(.).*@/,"$1***@") : "a***@gmail.com") + " (Demo OTP: 123456)" };
  if (f.action === "verify") { if (f.otp !== "123456") return { ok:false, error:"Incorrect OTP. (Demo OTP: 123456)" }; demoIn = true; return demoApi(); }
  if (f.action === "logout") { demoIn = false; return { ok:true }; }
}

/* Custom order login (track.html wala hi): mobile + koi ek order number. Is phone par yaad rehta hai (la_track) */
const TSAVE = "la_track";
const tsaved = v => { try { if (v === undefined) return JSON.parse(localStorage.getItem(TSAVE) || "null"); v ? localStorage.setItem(TSAVE, JSON.stringify(v)) : localStorage.removeItem(TSAVE); } catch(e) { return null; } };
async function gas(action, body){
  try { const r = await fetch(SCRIPT, { method:"POST", body:JSON.stringify({ action, ...body }), headers:{ "Content-Type":"text/plain;charset=utf-8" } }); return await r.json(); }
  catch(e) { return { ok:false, net:true, error:"Please check your internet connection and try again." }; }
}
const DEMO_ORD = [{ id:"12", time:new Date(Date.now() - 5 * 36e5).toISOString(), topic:"Physics Class 12 — Electric Charges", slides:"25", status:"Done", ready:true, price:250 },
  { id:"9", time:new Date(Date.now() - 9 * 864e5).toISOString(), topic:"Class 8 Science — Cell", slides:"18", status:"Paid", ready:true, price:180 }];
async function ordersOf(w){
  if (!w || !w.id || !w.phone) return null;
  if (!SCRIPT || window.claude) return w.id === "12" ? { ok:true, orders:DEMO_ORD } : { ok:false, error:"Demo: enter order number 12." };
  return gas("customMine", w);
}
/* ===== Login ke baad: My Account dashboard (9 hisse) =====
   PPT · Notifications · Purchased PPTs · My Orders · Payment History · Favourite · Recently Viewed · Settings · Help
   Favourite / Recently Viewed / naam / notification "padh liya" isi phone (localStorage) mein rehte hain. */
const LSG = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch(e) { return d; } };
const LSS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const WA_NO = String((window.LA_CONFIG || {}).whatsapp || "919711069435").replace(/\D/g, "");
const MAIL = String((window.LA_CONFIG || {}).email || "");
const waL = m => "https://wa.me/" + WA_NO + "?text=" + encodeURIComponent(m);
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const dt = t => { const d = new Date(String(t || "").replace(" ", "T")); return isNaN(d) ? "" : d.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" }); };
const MST = { New:"Received", "In Progress":"In progress", Done:"Ready · Pay now", Paid:"Paid ✓", Cancelled:"Cancelled" };
const STEP = { New:1, "In Progress":2, Done:3, Paid:4 };
const stCls = s => s === "Done" ? "ready" : s === "Paid" ? "paid" : s === "Cancelled" ? "cx" : "";
/* Store ki PPT list (daam, photo, naye PPT ke liye) — pichhli baar ki, warna ek baar Google Script se */
let CAT = LSG("la_ppts", []);
if (!CAT.length && SCRIPT && !window.claude) fetch(SCRIPT + "?action=ppts").then(r => r.json()).then(j => { if (j && j.ok && j.products) { CAT = j.products; if (!$("#mine").hidden) draw(); } }).catch(() => {});
if (!CAT.length && window.claude) CAT = [1,2,3,4,5].map(i => ({ id:i, title:["","Photosynthesis — Class 10 Science","भारत का संविधान — Class 8 SST","Newton's Laws of Motion — Class 9","Fractions Made Easy — Class 5 Maths","Startup Business Plan Pitch Deck"][i], price:[0,49,39,59,1,99][i], mrp:[0,99,79,119,59,199][i], thumb:`uploads/previews/demo-${["","photosynthesis","samvidhan","newton","fractions","pitch"][i]}-1.webp`, added:i }));
const pOf = id => CAT.find(p => +p.id === +id);
const thumbOf = p => p && (p.thumb || ((p.previews || []).find(u => u && !/#card-end$/.test(u))) || "");

const TABS = [
  ["home", "📂", "Home", ""], ["noti", "🔔", "Notifications", ""], ["ppts", "🗂️", "My PPTs", ""],
  ["orders", "🧾", "Orders", ""], ["pay", "💳", "Payments", ""], ["fav", "❤️", "Favourites", ""],
  ["recent", "🕘", "Recent", ""], ["set", "⚙️", "Settings", ""], ["help", "💬", "Help", ""]
];
let TAB = (location.hash.match(/^#t=(\w+)/) || [])[1] || "home", ME = { loggedIn:false }, ORD = null;   /* ME: kharidi PPTs (OTP) · ORD: { phone, id, orders } custom orders */

function notifs(){
  const L = [];
  (ORD && ORD.orders || []).slice(0, 10).forEach(o => L.push({ t:o.time, ic:o.status === "Done" ? "🎉" : o.status === "Paid" ? "✅" : o.status === "Cancelled" ? "❌" : "📦",
    b:`Order #${o.id}: ${MST[o.status] || o.status}`, s:o.topic, go:"orders" }));
  buys().forEach(p => L.push({ t:p.date, ic:"💳", b:"Payment received. Your PPT is ready to download.", s:p.title, go:"ppts" }));
  CAT.filter(p => +p.mrp > +p.price).slice().sort((a, b) => String(b.added || "").localeCompare(String(a.added || ""), undefined, { numeric:true })).slice(0, 3)
    .forEach(p => L.push({ t:typeof p.added === "string" ? p.added : "", ic:"🏷️", b:`Offer: ${Math.round((1 - p.price / p.mrp) * 100)}% OFF — ${inr(p.price)}`, s:p.title, href:"ready-ppts.html?id=" + p.id }));
  return L.sort((a, b) => (new Date(b.t) - new Date(a.t)) || 0);
}
const unread = () => { const seen = LSG("la_noti_seen", 0); return notifs().filter(n => n.t && new Date(n.t) > seen && n.ic !== "🏷️").length; };
let BUY = [];   /* order number login: isi mobile se kharidi Ready PPTs (Apps Script "acctByOrder") */
const buys = () => ME.loggedIn ? (ME.items || []) : BUY;
async function loadBuys(){
  if (ME.loggedIn || !ORD || !SCRIPT || window.claude) return;
  const r = await gas("acctByOrder", { id:ORD.id, phone:ORD.phone });
  if (r && r.ok && Array.isArray(r.items)) { BUY = r.items; if (!$("#mine").hidden) draw(); }
}
/* Purchased list: Ready PPTs + paid custom PPT orders, ek hi jagah */
const customPaid = () => (ORD && ORD.orders || []).filter(o => o.status === "Paid");
const custRow = o => `<div class="item"><div class="thumb cthumb"><span>✨ Custom PPT</span></div>
    <div class="b"><b>${esc(o.topic)}</b><small>Order #${esc(o.id)} · ${dt(o.time)}</small>
      <a class="btn btn-gold btn-sm" href="track.html#id=${encodeURIComponent(o.id)}" data-oid="${esc(o.id)}">${icon("i-dl")} Download PPT</a></div></div>`;
const allBought = fresh => buys().slice().sort((a, b) => (fresh || []).includes(b.id) - (fresh || []).includes(a.id)).map(p => pptRow(p, (fresh || []).includes(p.id))).concat(customPaid().map(custRow));
const otpHint = () => ME.loggedIn ? "" : `<p class="hint"><a href="#" id="linkPpt">Missing a PPT? Sign in with email</a></p>`;
function payments(){
  const g = {};
  buys().forEach(p => { const k = String(p.orderId || p.date); (g[k] = g[k] || { id:k, t:p.date, items:[], kind:"Ready PPT" }).items.push(p); });
  const L = Object.values(g).map(x => ({ ...x, amt:x.items.reduce((s, p) => s + (+(pOf(p.id) || {}).price || 0), 0) }));
  (ORD && ORD.orders || []).filter(o => o.status === "Paid").forEach(o => L.push({ id:"Order #" + o.id, t:o.time, kind:"Custom PPT", items:[{ title:o.topic }], amt:+o.price || 0 }));
  return L.sort((a, b) => new Date(b.t) - new Date(a.t));
}

function show(me){
  if (me) ME = me;
  const inP = !!ME.loggedIn, inO = !!(ORD && ORD.orders), any = inP || inO;
  $("#login").hidden = any; $("#mine").hidden = !any;
  if (!any) { if (ME.otp !== undefined) OTP = !!ME.otp; resetLogin(); return; }
  if (NEW) TAB = "home";
  draw(); if (innerWidth < 760 && !NEW && !/^#t=/.test(location.hash)) document.body.dataset.view = "menu";
}
function draw(){

(function(){

  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(() => { if (root.getAttribute("data-mode") === "system") apply("system"); });
})();
