<title>My PPTs — Lakshay Agency</title>
<script>
/* Theme: homepage wali setting yahan bhi lagti hai */
(function(){var m="system";try{m=localStorage.getItem("la_theme")||"system"}catch(e){}
var l=m==="light"||(m==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.classList.toggle("light",l);})();
</script>

<style>
/* ===== COLORS (homepage jaise) ===== */
:root{
  --bg:#07080c; --bg2:#0b0d14; --card:#0f121b; --card2:#141826;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f4f5fb; --muted:#9aa1b8; --dim:#6b7290;
  --violet:#8b2cff; --cyan:#06b6d4; --pink:#ec4899; --green:#22c55e; --amber:#f59e0b; --gold:#fde047;
  --grad:linear-gradient(90deg,#8b2cff,#06b6d4);
  --shadow:0 20px 60px -20px rgba(139,44,255,.45);
}
html.light{
  --bg:#f6f5fb; --bg2:#eeedf6; --card:#ffffff; --card2:#f3f2fa;
  --line:rgba(20,16,40,.09); --line2:rgba(20,16,40,.16);
  --text:#16131f; --muted:#5d5873; --dim:#8a85a0; --shadow:0 18px 40px -22px rgba(139,44,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans','Hind',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk','Hind',sans-serif;line-height:1.2;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.container{width:min(1240px,100% - 32px);margin-inline:auto}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#fde047,#f59e0b);color:#1a1200}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--card2);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-wa{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#22c55e}
.btn-sm{padding:9px 12px;font-size:.82rem;border-radius:10px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box}
.logo b{font-family:'Space Grotesk';font-size:1rem;display:block;line-height:1}
.logo small{font-size:.58rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.back{margin-left:auto;color:var(--muted);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px}
.back:hover{color:var(--text);background:var(--card2)}

/* ===== MY PPTs ===== */
main{padding:40px 0 70px}
.box{width:min(440px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.box h1{font-size:1.5rem} .box p{color:var(--muted);font-size:.9rem}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(139,44,255,.15);color:#c084fc}
.ic svg{width:26px;height:26px}
label{display:grid;gap:6px;font-size:.84rem;font-weight:700}
input{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;font-size:1rem;width:100%}
input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,44,255,.2)}
.otp{letter-spacing:.5em;text-align:center;font-size:1.3rem;font-weight:800}
.phone{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.phone span{padding:0 4px 0 14px;color:var(--muted);font-weight:700}
.phone input{border:0;background:none;box-shadow:none!important}
.phone:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,44,255,.2)}
.btn{width:100%}
.links{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.links button{color:var(--cyan);font-weight:700} .links button:disabled{color:var(--dim);cursor:default}
.box .msg{font-size:.84rem;font-weight:600;color:#ef4444;min-height:1.2em}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:1.6rem} .top p{color:var(--muted);font-size:.9rem}
.top .btn{width:auto;margin-left:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.thumb{aspect-ratio:16/9;background:var(--card2) center/cover}
.item .b{padding:14px;display:grid;gap:10px}
.item b{font-family:'Space Grotesk','Hind';font-size:1rem;line-height:1.3}
.item small{color:var(--muted);font-size:.78rem;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:50px 10px;display:grid;gap:14px;justify-items:center}
.empty .btn{width:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  <section class="box" id="login" hidden>

    </div>

  </section>

<script>
/* demo:true sirf preview ke liye: koi bhi number, OTP 123456 */
const CONFIG = { demo:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = id => `<svg class="i"><use href="#${id}"/></svg>`;
let tt; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); };
const msg = m => { $("#msg").textContent = m || ""; };
let phone = "", timer = 0, API = true, OTP = false;

async function api(fields){
  if (!API) return demoApi(fields);
  try {
    const r = await (fields ? fetch("api/account.php", { method:"POST", body:Object.entries(fields).reduce((f,[k,v]) => (f.append(k,v), f), new FormData()), headers:{ Accept:"application/json" } })
                            : fetch("api/account.php", { headers:{ Accept:"application/json" }, cache:"no-store" }));
    const j = await r.json(); return j.ok ? j : { ok:false, error:j.error || "Kuch gadbad ho gayi." };
  } catch(e) { return { ok:false, error:"Internet check karein aur dobara try karein.", offline:true }; }
}
/* Preview (bina server) */
let demoIn = false;
function demoApi(f){
  const items = [{ id:1, title:"Photosynthesis — Class 10 Science", thumb:"uploads/previews/demo-photosynthesis-1.webp", orderId:12, date:"2026-10-20 18:42:00", url:"#demo" },
                 { id:3, title:"Newton's Laws of Motion — Class 9", thumb:"uploads/previews/demo-newton-1.webp", orderId:15, date:"2026-10-24 11:05:00", url:"#demo" }];
  if (!f) return demoIn ? { ok:true, loggedIn:true, phone:"******" + phone.slice(-4), items } : { ok:true, loggedIn:false, otp:false };
  if (f.action === "login") { demoIn = true; return demoApi(); }
  if (f.action === "send") return { ok:true, via:"sms", to:"******" + f.phone.slice(-4) };
  if (f.action === "verify") { if (f.otp !== "123456") return { ok:false, error:"OTP galat hai. (Demo OTP: 123456)" }; demoIn = true; return demoApi(); }
  if (f.action === "logout") { demoIn = false; return { ok:true }; }
}

function show(me){
  $("#login").hidden = me.loggedIn; $("#mine").hidden = !me.loggedIn;
  if (!me.loggedIn) { if (me.otp !== undefined) OTP = !!me.otp; $("#sendBtn").textContent = OTP ? "OTP Bhejo" : "Login"; $("#fPhone").hidden = false; $("#fOtp").hidden = true; return; }
  $("#who").textContent = `Mobile ${me.phone} · ${me.items.length} PPT${me.items.length === 1 ? "" : "s"}`;
  $("#list").innerHTML = me.items.length ? me.items.map(p => `<div class="item">
      <div class="thumb" style="background-image:url('${esc(p.thumb).replace(/'/g,"")}')"></div>
      <div class="b"><b>${esc(p.title)}</b><small>Order #${p.orderId} · ${new Date(p.date.replace(" ","T")).toLocaleDateString("en-IN",{ day:"numeric", month:"short", year:"numeric" })}</small>
        ${p.url ? `<a class="btn btn-gold btn-sm" href="${esc(p.url)}">${icon("i-dl")} Download PPT</a>` : `<span class="btn btn-ghost btn-sm" style="cursor:default">File tayyar ho rahi hai</span>`}</div></div>`).join("")
    : `<div class="empty" style="grid-column:1/-1"><p>Is number par abhi koi PPT nahi hai.</p><a class="btn btn-gold" href="ready-ppts.html">Ready PPTs dekhein</a></div>`;
}
function startTimer(){
  let n = 30; const b = $("#resend"); b.disabled = true; clearInterval(timer);
  b.textContent = `OTP dobara bhejo (${n}s)`;
  timer = setInterval(() => { n--; b.textContent = n > 0 ? `OTP dobara bhejo (${n}s)` : "OTP dobara bhejo"; if (n <= 0) { clearInterval(timer); b.disabled = false; } }, 1000);
}
async function send(){
  phone = $("#phone").value.replace(/\D/g,"").replace(/^(91|0)(?=\d{10}$)/,"");
  if (!/^[6-9]\d{9}$/.test(phone)) { msg("Sahi 10-digit mobile number likhiye."); $("#phone").focus(); return; }
  msg(""); const b = $("#sendBtn"); b.disabled = true; b.textContent = OTP ? "Bhej rahe hain…" : "Check ho raha hai…";
  const r = await api({ action:OTP ? "send" : "login", phone, website:$("#hp").value });
  b.disabled = false; b.textContent = OTP ? "OTP Bhejo" : "Login";
  if (!r.ok) { msg(r.error); return; }
  if (!OTP) { toast("✓ Login ho gaya"); show(r); return; }
  $("#sentTo").innerHTML = `OTP <b>${esc(r.to)}</b> par bheja gaya hai${r.via === "email" ? " (email)" : ""}.`;
  $("#fPhone").hidden = true; $("#fOtp").hidden = false; $("#otp").value = ""; $("#otp").focus(); startTimer();
}
$("#fPhone").onsubmit = e => { e.preventDefault(); send(); };
$("#resend").onclick = send;
$("#changeNo").onclick = () => { $("#fOtp").hidden = true; $("#fPhone").hidden = false; msg(""); $("#phone").focus(); };
$("#otp").oninput = e => { e.target.value = e.target.value.replace(/\D/g,""); if (e.target.value.length === 6) $("#fOtp").requestSubmit(); };
$("#phone").oninput = e => { e.target.value = e.target.value.replace(/\D/g,""); };
$("#fOtp").onsubmit = async e => {
  e.preventDefault(); const otp = $("#otp").value;
  if (otp.length !== 6) { msg("6-digit OTP daalein."); return; }
  const b = $("#verifyBtn"); b.disabled = true; b.textContent = "Check ho raha hai…";
  const r = await api({ action:"verify", phone, otp });
  b.disabled = false; b.textContent = "Verify & Login";
  if (!r.ok) { msg(r.error); $("#otp").select(); return; }
  msg(""); toast("✓ Login ho gaya"); show(r);
};
$("#logout").onclick = async () => { await api({ action:"logout" }); show({ loggedIn:false }); toast("Logout ho gaya"); };
document.addEventListener("click", e => { if (e.target.closest('a[href="#demo"]')) { e.preventDefault(); toast("✓ Asli website par yahan se PPT download hogi"); } });

(async function boot(){
  let me = await api();
  if (!me.ok && CONFIG.demo) { API = false; me = await api(); }
  show(me.ok ? me : { loggedIn:false });
  if (!me.ok && !CONFIG.demo) msg(me.error);
})();
</script>
</body>
